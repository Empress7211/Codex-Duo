<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Codex Duo：一个工作区，多个 Codex 窗口</title><desc id="desc">功能结构示意：原生 Codex 与多个隔离认证的工具实例使用本地共享历史。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#518088"/></marker></defs><rect width="1200" height="760" rx="24" fill="#f3f6fa"/><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="69" font-size="44" fill="#1d3048" font-weight="700">Codex Duo</text><text x="48" y="111" font-size="27" fill="#1d3048" font-weight="400">一个工作区，多个 Codex 窗口</text><rect x="914" y="38" width="238" height="42" rx="21" fill="#e2f3ed" stroke="#e2f3ed"/><text x="938" y="66" font-size="17" fill="#246454" font-weight="600">macOS · Apple Silicon</text><text x="48" y="151" font-size="18" fill="#5c6c81" font-weight="400">结构示意 · 独立登录 / 共享本地历史 / 受管窗口间同步</text><rect x="48" y="197" width="340" height="224" rx="18" fill="#fff" stroke="#dbe3ed"/><rect x="48" y="197" width="340" height="42" rx="18" fill="#e8eef5" stroke="#e8eef5"/><circle cx="68" cy="218" r="5" fill="#ed8e86"/><circle cx="88" cy="218" r="5" fill="#edc56a"/><circle cx="108" cy="218" r="5" fill="#79bea0"/><text x="72" y="282" font-size="24" fill="#1d3048" font-weight="650">原生 Codex</text><text x="72" y="324" font-size="18" fill="#5c6c81" font-weight="400">保留你现有的订阅登录</text><text x="72" y="382" font-size="17" fill="#246454" font-weight="400">官方应用保持原样</text><path d="M218,432 L218,504" stroke="#518088" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="197" width="340" height="224" rx="18" fill="#fff" stroke="#dbe3ed"/><rect x="430" y="197" width="340" height="42" rx="18" fill="#e8eef5" stroke="#e8eef5"/><circle cx="450" cy="218" r="5" fill="#ed8e86"/><circle cx="470" cy="218" r="5" fill="#edc56a"/><circle cx="490" cy="218" r="5" fill="#79bea0"/><text x="454" y="282" font-size="24" fill="#1d3048" font-weight="650">API 窗口 A</text><text x="454" y="324" font-size="18" fill="#5c6c81" font-weight="400">选择自己的 CC Switch 配置</text><text x="454" y="382" font-size="17" fill="#246454" font-weight="400">独立认证 · 独立窗口缓存</text><path d="M600,432 L600,504" stroke="#518088" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="812" y="197" width="340" height="224" rx="18" fill="#fff" stroke="#dbe3ed"/><rect x="812" y="197" width="340" height="42" rx="18" fill="#e8eef5" stroke="#e8eef5"/><circle cx="832" cy="218" r="5" fill="#ed8e86"/><circle cx="852" cy="218" r="5" fill="#edc56a"/><circle cx="872" cy="218" r="5" fill="#79bea0"/><text x="836" y="282" font-size="24" fill="#1d3048" font-weight="650">订阅 / API 窗口 B</text><text x="836" y="324" font-size="18" fill="#5c6c81" font-weight="400">按需要增加登录方式</text><text x="836" y="382" font-size="17" fill="#246454" font-weight="400">独立认证 · 独立窗口缓存</text><path d="M982,432 L982,504" stroke="#518088" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="520" width="1104" height="118" rx="18" fill="#1d3048" stroke="#1d3048"/><text x="80" y="567" font-size="27" fill="#fff" font-weight="650">同一套本地工作历史</text><text x="80" y="608" font-size="21" fill="#c6d8e8" font-weight="400">项目与会话 · 已落盘消息 · 真实写锁</text><text x="48" y="687" font-size="21" fill="#1d3048" font-weight="550">共享历史不等于共享登录；同一会话仍受真实写锁保护。</text><text x="48" y="722" font-size="18" fill="#5c6c81" font-weight="400">原生运行窗口的侧栏与消息刷新由官方客户端决定，不能保证即时双向刷新。</text></g></svg>