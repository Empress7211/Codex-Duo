<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">会话接管：任务空闲与写入权分别判断</title><desc id="desc">同一会话被占用时等待，受管持有者全部工作空闲时请求释放，原生持有者由官方自行释放。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#518088"/></marker></defs><rect width="1200" height="660" rx="24" fill="#f3f6fa"/><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="67" font-size="35" fill="#1d3048" font-weight="700">任务结束 ≠ 写入权已经释放</text><text x="48" y="109" font-size="19" fill="#5c6c81" font-weight="400">会话接管示意 · 输入区在恢复及写入权核实成功后开放</text><rect x="48" y="166" width="300" height="148" rx="18" fill="#fff" stroke="#dbe3ed"/><text x="72" y="214" font-size="23" fill="#1d3048" font-weight="600">在窗口 B 打开已有会话</text><text x="72" y="253" font-size="19" fill="#5c6c81" font-weight="400">先恢复，再核实真实写锁</text><text x="72" y="287" font-size="18" fill="#246454" font-weight="400">核实期间不可发送</text><path d="M360,240 L427,240" stroke="#518088" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="440" y="166" width="308" height="148" rx="18" fill="#fff" stroke="#dbe3ed"/><text x="464" y="214" font-size="22" fill="#1d3048" font-weight="600">是否仍被其他后端持有？</text><text x="464" y="255" font-size="18" fill="#5c6c81" font-weight="400">任务空闲与写入权分别显示</text><text x="464" y="288" font-size="18" fill="#246454" font-weight="400">保留真实占用和重试提示</text><path d="M760,240 L827,240" stroke="#518088" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="840" y="166" width="312" height="148" rx="18" fill="#e2f3ed" stroke="#c4e3d8"/><text x="865" y="214" font-size="23" fill="#246454" font-weight="650">锁已释放 → 允许续聊</text><text x="865" y="255" font-size="19" fill="#246454" font-weight="400">窗口 B 使用自己的登录</text><text x="865" y="287" font-size="18" fill="#246454" font-weight="400">同一会话避免并发写入</text><path d="M594,328 L594,379" stroke="#518088" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="400" width="536" height="166" rx="18" fill="#fff" stroke="#dbe3ed"/><text x="72" y="443" font-size="23" fill="#1d3048" font-weight="600">持有者为 Duo 工具实例</text><text x="72" y="486" font-size="19" fill="#5c6c81" font-weight="400">全部会话空闲且没有待答审批等工作时，</text><text x="72" y="525" font-size="19" fill="#5c6c81" font-weight="400">可请求替换其 app-server 以释放写锁。</text><rect x="608" y="400" width="544" height="166" rx="18" fill="#fff" stroke="#dbe3ed"/><text x="632" y="443" font-size="23" fill="#1d3048" font-weight="600">持有者为原生 Codex</text><text x="632" y="486" font-size="19" fill="#5c6c81" font-weight="400">等待官方自行释放；需要时由用户结束工作</text><text x="632" y="525" font-size="19" fill="#5c6c81" font-weight="400">并关闭对应原生实例。Duo 不删除锁。</text><text x="48" y="618" font-size="19" fill="#5c6c81" font-weight="400">跨供应商续聊仍可能受原后端加密推理内容等兼容性限制。</text></g></svg>