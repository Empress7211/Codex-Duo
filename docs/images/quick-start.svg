<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">Codex Duo 首次使用四步图解</title><desc id="desc">连接共享工作区，新增实例，选择 API 或订阅登录，启动窗口并查看实时会话。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#518088"/></marker></defs><rect width="1200" height="1000" rx="24" fill="#f3f6fa"/><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="66" font-size="36" fill="#1d3048" font-weight="700">从一个工作区开始</text><text x="48" y="106" font-size="18" fill="#5c6c81" font-weight="400">操作图解 · 根据 0.6.0 界面文案绘制，非真实界面截图</text><rect x="48" y="144" width="1104" height="166" rx="18" fill="#fff" stroke="#dbe3ed"/><rect x="72" y="168" width="64" height="64" rx="18" fill="#dceeea" stroke="#dceeea"/><text x="84" y="210" font-size="29" fill="#246454" font-weight="700">01</text><text x="162" y="191" font-size="26" fill="#1d3048" font-weight="650">连接共享工作区</text><text x="162" y="232" font-size="22" fill="#246454" font-weight="550">实例页 → 连接共享工作区</text><text x="162" y="274" font-size="19" fill="#5c6c81" font-weight="400">让额外窗口连接已有本地项目与会话。</text><rect x="48" y="334" width="1104" height="166" rx="18" fill="#fff" stroke="#dbe3ed"/><rect x="72" y="358" width="64" height="64" rx="18" fill="#dceeea" stroke="#dceeea"/><text x="84" y="400" font-size="29" fill="#246454" font-weight="700">02</text><text x="162" y="381" font-size="26" fill="#1d3048" font-weight="650">新增所需实例</text><text x="162" y="422" font-size="22" fill="#246454" font-weight="550">＋ 新增实例 → API 实例 / 受管订阅实例</text><text x="162" y="464" font-size="19" fill="#5c6c81" font-weight="400">填写便于识别的名称，如“研究 API”。</text><rect x="48" y="524" width="1104" height="166" rx="18" fill="#fff" stroke="#dbe3ed"/><rect x="72" y="548" width="64" height="64" rx="18" fill="#dceeea" stroke="#dceeea"/><text x="84" y="590" font-size="29" fill="#246454" font-weight="700">03</text><text x="162" y="571" font-size="26" fill="#1d3048" font-weight="650">配置各自登录</text><text x="162" y="612" font-size="22" fill="#246454" font-weight="550">API：选择供应商 → 保存 API 配置</text><text x="162" y="654" font-size="19" fill="#5c6c81" font-weight="400">订阅：启动后，在该实例中亲自登录。</text><rect x="48" y="714" width="1104" height="166" rx="18" fill="#fff" stroke="#dbe3ed"/><rect x="72" y="738" width="64" height="64" rx="18" fill="#dceeea" stroke="#dceeea"/><text x="84" y="780" font-size="29" fill="#246454" font-weight="700">04</text><text x="162" y="761" font-size="26" fill="#1d3048" font-weight="650">打开窗口并开始工作</text><text x="162" y="802" font-size="22" fill="#246454" font-weight="550">启动 / 显示窗口 → 实时会话</text><text x="162" y="844" font-size="19" fill="#5c6c81" font-weight="400">查看任务执行状态，以及会话写入权。</text><text x="48" y="951" font-size="20" fill="#5c6c81" font-weight="400">已有工作区升级或改配置前，先结束相关任务并正常关闭工具实例。</text></g></svg>